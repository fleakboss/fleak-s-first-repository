<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You, Sis</title>
<style>
  :root {
    --pink: #ff8fab;
    --pink-deep: #ff5c8a;
    --lavender: #c9a7ff;
    --cream: #fff5f7;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Georgia', 'Segoe UI', serif;
    background: linear-gradient(-45deg, #ffdde1, #ffc2d1, #e7c6ff, #ffb3c6);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .hearts {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }

  .heart {
    position: absolute;
    bottom: -10%;
    font-size: 24px;
    color: rgba(255, 92, 138, 0.75);
    animation: floatUp linear infinite;
    user-select: none;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg);
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    90% {
      opacity: 1;
    }
    100% {
      transform: translateY(-110vh) translateX(var(--drift, 20px)) rotate(360deg);
      opacity: 0;
    }
  }

  .card {
    position: relative;
    z-index: 2;
    text-align: center;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(10px);
    border-radius: 32px;
    padding: 60px 50px;
    box-shadow: 0 20px 60px rgba(255, 92, 138, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.6);
    max-width: 90vw;
  }

  .big-heart {
    font-size: 64px;
    display: inline-block;
    animation: beat 1.2s ease-in-out infinite;
    margin-bottom: 10px;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    40% { transform: scale(1); }
    60% { transform: scale(1.1); }
  }

  h1 {
    font-size: clamp(2.5rem, 8vw, 5rem);
    background: linear-gradient(90deg, var(--pink-deep), var(--lavender), var(--pink-deep));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
    letter-spacing: 2px;
    margin: 10px 0;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  p.subtitle {
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    color: #7a3b52;
    margin-top: 14px;
    font-style: italic;
  }

  p.signature {
    margin-top: 30px;
    font-size: 1rem;
    color: #a15a72;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <div class="hearts" id="hearts"></div>

  <div class="card">
    <div class="big-heart">💗</div>
    <h1>I Love You</h1>
    <p class="subtitle">To the best sister in the whole world — always and forever.</p>
    <p class="signature">— with love, your sibling 💕</p>
  </div>

  <script>
    const container = document.getElementById('hearts');
    const symbols = ['💖', '💕', '💗', '💓', '❤️', '💞'];

    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (16 + Math.random() * 24) + 'px';
      heart.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
      heart.style.animationDuration = (6 + Math.random() * 6) + 's';
      container.appendChild(heart);
      setTimeout(() => heart.remove(), 13000);
    }

    setInterval(createHeart, 400);
    for (let i = 0; i < 10; i++) {
      setTimeout(createHeart, i * 200);
    }
  </script>

</body>
</html>
