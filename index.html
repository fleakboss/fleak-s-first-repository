<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You, Sis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400;1,9..144,600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #fdf1ef;
    --ground-deep: #ffe1e6;
    --ink: #3f2230;
    --ink-soft: #7a5063;
    --accent: #c9184a;
    --accent-soft: #ff8fa3;
    --gold: #c79a4b;
    --glow: 255, 143, 163;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #221019;
      --ground-deep: #2c1420;
      --ink: #f7e3ea;
      --ink-soft: #cf9fb2;
      --accent: #ff87a3;
      --accent-soft: #ff5f82;
      --gold: #e6c17c;
      --glow: 255, 135, 163;
    }
  }

  :root[data-theme="dark"] {
    --ground: #221019;
    --ground-deep: #2c1420;
    --ink: #f7e3ea;
    --ink-soft: #cf9fb2;
    --accent: #ff87a3;
    --accent-soft: #ff5f82;
    --gold: #e6c17c;
    --glow: 255, 135, 163;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: radial-gradient(ellipse 90% 60% at 50% 0%, var(--ground-deep), var(--ground) 70%);
    color: var(--ink);
    font-family: 'Quicksand', 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 6vh 6vw;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    background: radial-gradient(circle, rgba(var(--glow), 0.55), rgba(var(--glow), 0) 70%);
    pointer-events: none;
    animation: drift 16s ease-in-out infinite;
  }
  .glow.one   { width: 42vw; height: 42vw; top: -12vw; left: -10vw; animation-delay: 0s; }
  .glow.two   { width: 34vw; height: 34vw; bottom: -14vw; right: -8vw; animation-delay: -6s; }
  .glow.three { width: 24vw; height: 24vw; top: 30%; right: 12%; opacity: 0.6; animation-delay: -11s; }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(2vw, 3vw) scale(1.08); }
  }

  main {
    position: relative;
    z-index: 2;
    max-width: 46rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.6rem;
  }

  .eyebrow {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .eyebrow::before,
  .eyebrow::after {
    content: "♡";
    margin: 0 0.7em;
    font-size: 0.75em;
    vertical-align: middle;
    opacity: 0.85;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-optical-sizing: auto;
    font-size: clamp(3.2rem, 12vw, 7.5rem);
    line-height: 0.98;
    letter-spacing: -0.01em;
    text-wrap: balance;
    color: var(--accent);
    opacity: 0;
    animation: rise 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.15s forwards;
  }

  .rule {
    width: 4.5rem;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0;
    animation: rise 0.9s ease 0.55s forwards;
  }

  p.subtitle {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.15rem, 2.6vw, 1.5rem);
    color: var(--ink-soft);
    max-width: 30ch;
    line-height: 1.5;
    opacity: 0;
    animation: rise 1s ease 0.4s forwards;
  }

  p.signature {
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.06em;
    color: var(--ink);
    opacity: 0;
    animation: rise 1s ease 0.75s forwards;
  }

  p.signature span {
    color: var(--accent);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .heart {
    position: absolute;
    color: var(--accent-soft);
    opacity: 0.55;
    animation: bob 7s ease-in-out infinite;
    z-index: 1;
  }
  .heart svg { width: 100%; height: 100%; display: block; }
  .heart.h1 { width: 22px; top: 18%; left: 12%; animation-delay: -1s; }
  .heart.h2 { width: 16px; top: 66%; left: 8%; animation-delay: -3.5s; }
  .heart.h3 { width: 28px; top: 12%; right: 10%; animation-delay: -5s; }
  .heart.h4 { width: 18px; top: 72%; right: 14%; animation-delay: -2s; }
  .heart.h5 { width: 14px; top: 42%; left: 4%; animation-delay: -6.2s; opacity: 0.4; }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-18px) rotate(4deg); }
  }
</style>
</head>
<body>

  <div class="glow one"></div>
  <div class="glow two"></div>
  <div class="glow three"></div>

  <span class="heart h1"><svg viewBox="0 0 32 29" fill="currentColor"><path d="M16 29 2.6 16.6C-1 13.1-.6 7 3.6 4 6.4 2 10.3 2.4 12.8 5l3.2 3.2L19.2 5c2.5-2.6 6.4-3 9.2-1 4.2 3 4.6 9.1.9 12.6Z"/></svg></span>
  <span class="heart h2"><svg viewBox="0 0 32 29" fill="currentColor"><path d="M16 29 2.6 16.6C-1 13.1-.6 7 3.6 4 6.4 2 10.3 2.4 12.8 5l3.2 3.2L19.2 5c2.5-2.6 6.4-3 9.2-1 4.2 3 4.6 9.1.9 12.6Z"/></svg></span>
  <span class="heart h3"><svg viewBox="0 0 32 29" fill="currentColor"><path d="M16 29 2.6 16.6C-1 13.1-.6 7 3.6 4 6.4 2 10.3 2.4 12.8 5l3.2 3.2L19.2 5c2.5-2.6 6.4-3 9.2-1 4.2 3 4.6 9.1.9 12.6Z"/></svg></span>
  <span class="heart h4"><svg viewBox="0 0 32 29" fill="currentColor"><path d="M16 29 2.6 16.6C-1 13.1-.6 7 3.6 4 6.4 2 10.3 2.4 12.8 5l3.2 3.2L19.2 5c2.5-2.6 6.4-3 9.2-1 4.2 3 4.6 9.1.9 12.6Z"/></svg></span>
  <span class="heart h5"><svg viewBox="0 0 32 29" fill="currentColor"><path d="M16 29 2.6 16.6C-1 13.1-.6 7 3.6 4 6.4 2 10.3 2.4 12.8 5l3.2 3.2L19.2 5c2.5-2.6 6.4-3 9.2-1 4.2 3 4.6 9.1.9 12.6Z"/></svg></span>

  <main>
    <p class="eyebrow">To My Sister</p>
    <h1>I love you</h1>
    <div class="rule"></div>
    <p class="subtitle">Through every season, every fight, every inside joke &mdash; you're my favorite person to call family.</p>
    <p class="signature">Always your sibling <span>&hearts;</span></p>
  </main>

</body>
</html>
